name: MemoFlowIOS
options:
  bundleIdPrefix: com.memoflow
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  MemoFlowIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoFlowIOS
    info:
      path: MemoFlowIOS/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: MemoFlow
        MEMOFLOW_OPENAI_MODEL: gpt-4o-mini
        MEMOFLOW_OPENAI_BASE_URL: https://api.openai.com/v1/responses
    settings:
      base:
        PRODUCT_NAME: MemoFlowIOS
        PRODUCT_BUNDLE_IDENTIFIER: com.memoflow.ios
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: MemoFlowIOS/Info.plist
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_EMIT_LOC_STRINGS: NO
  MemoFlowIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemoFlowIOSTests
    dependencies:
      - target: MemoFlowIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MemoFlowIOS:
    build:
      targets:
        MemoFlowIOS: all
        MemoFlowIOSTests: [test]
    test:
      targets:
        - MemoFlowIOSTests
